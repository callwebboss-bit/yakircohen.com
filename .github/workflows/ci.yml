name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # audit בג'וב נפרד: קודם הוא היה שלב בתוך build, ו-audit אדום דילג על
  # lint, הבדיקות והבנייה, כך שלא ראינו אם הקוד עצמו תקין. הוא עדיין חוסם
  # (ה-run נכשל אם הג'וב אדום), רק לא מסתיר את שאר השערים.
  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # audit קורא את package-lock.json בלבד, ולכן אין צורך ב-npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 כי שומרים שנשענים על היסטוריית git נכשלים בשיבוט
      # רדוד, ואז הם נכשלים בענן ועוברים מקומית, כלומר הכי גרוע.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # שער אחד במקום אחד עשר שלבים בודדים. לפני השינוי CI הריץ 11 שומרים
      # מתוך 24, ו-12 מהם - ובהם audit:llms-prices, audit:prose-prices
      # ו-audit:client-data-weight - לא רצו בשום pull request.
      - name: Audit SEO, schema, prices and client weight
        run: npm run verify:seo

      - name: Audit images
        run: npm run audit:images

      - name: Audit links
        run: npm run audit:links

      - name: Audit headings
        run: npm run audit:headings

      - name: Audit pricing
        run: npm run audit:pricing

      - name: Audit copy (no AI tells)
        run: npm run audit:ai-tells

      - name: Build (with Pagefind)
        run: npm run build:full

      # שער אי-הפגיעה: משווה לכל אחת מ-316 הכתובות את הכותרת, התיאור,
      # הקנוניקל, ה-robots, ה-h1, מתאר הכותרות, סט הקישורים היוצאים,
      # מספר הקישורים הנכנסים, ספירת המילים, התמונות וה-alt שלהן,
      # וסט מפתחות המאפיינים ב-JSON-LD, מול בסיס שמור.
      #
      # continue-on-error זמני ומכוון, לפי הכלל ששומר חדש נכנס קודם
      # במצב דיווח: הבסיס נלכד על בנייה מקומית במק, ועדיין לא הוכח
      # שבנייה ב-ubuntu מייצרת HTML זהה בתו. להסיר את continue-on-error
      # אחרי הרצת CI אחת שבה הדיווח ריק.
      - name: Audit SEO diff (report mode until CI build determinism is proven)
        run: npm run audit:seo-diff
        continue-on-error: true

      # axe על שמונה עמודים מול שרת אמיתי. עד 16.9.2026 השלב רץ בלי שרת
      # ובלי RUN_A11Y, ולכן הסקריפט הדפיס SKIPPED ויצא 0: אפס עמודים נבדקו
      # והשלב היה ירוק. עכשיו הדפדפן מותקן, next start עולה מהבנייה שלמעלה,
      # והאודיט נכשל באמת על critical/serious.
      # continue-on-error זמני ומכוון: זו ההרצה הראשונה של axe ב-CI, ולא
      # ידוע מה הוא ימצא בשמונת העמודים מעבר ל-12 התבניות שנמדדו מקומית.
      # להסיר אחרי הרצה אחת ירוקה.
      # פורט 3010 ולא 3000: שלב ה-Cypress שאחרי מרים dev על 3000 דרך
      # start-server-and-test, ושרת שכבר תופס את הפורט היה מפיל אותו.
      - name: Install Chromium for axe
        run: npx playwright install --with-deps chromium

      - name: Start the built site for audits
        run: |
          npx next start -p 3010 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3010/ > /dev/null && exit 0
            sleep 2
          done
          echo "השרת לא עלה תוך 120 שניות" >&2
          exit 1

      - name: Audit a11y (axe, 8 pages, non-blocking until the first green run)
        run: npm run audit:a11y
        env:
          RUN_A11Y: "1"
          BASE_URL: http://localhost:3010
        continue-on-error: true

      # a11y.cy.ts ו-booking-flows.cy.ts נכתבו ומעולם לא רצו, כי cy:run:only
      # מקודד רק שניים מארבעת הספקים. עכשיו כולם רצים.
      # continue-on-error זמני ומכוון: a11y.cy.ts ייכשל על בעיות הנגישות
      # שטרם תוקנו, וזו בדיוק המטרה, להפוך כישלון שקט לכישלון גלוי.
      # להסיר את continue-on-error ברגע ש-axe נקי מ-critical ומ-serious.
      - name: Cypress E2E (4 specs, non-blocking until a11y is clean)
        run: npm run cy:run
        continue-on-error: true
