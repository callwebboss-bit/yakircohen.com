name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # שער אחד במקום אחד עשר שלבים בודדים. לפני השינוי CI הריץ 11 שומרים
      # מתוך 24, ו-12 מהם - ובהם audit:llms-prices, audit:prose-prices
      # ו-audit:client-data-weight - לא רצו בשום pull request.
      - name: Audit SEO, schema, prices and client weight
        run: npm run verify:seo

      - name: Audit images
        run: npm run audit:images

      - name: Audit links
        run: npm run audit:links

      - name: Audit headings
        run: npm run audit:headings

      - name: Audit pricing
        run: npm run audit:pricing

      - name: Audit copy (no AI tells)
        run: npm run audit:ai-tells

      - name: Build (with Pagefind)
        run: npm run build:full

      # רץ אחרי הבנייה. קודם הוא ישב לפניה ובלי שרת, כך שכל page.goto
      # נכשל והאודיט דיווח תקין אחרי אפס עמודים שנבדקו.
      - name: Audit a11y (skip unless RUN_A11Y=1)
        run: npm run audit:a11y

      - name: Cypress E2E
        run: npm run cy:run
